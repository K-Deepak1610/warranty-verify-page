<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain Verified | WarrantyChain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #0f172a; }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .glow {
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.15);
        }
        .status-badge {
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    <!-- Abstract Background -->
    <div class="absolute top-0 left-0 w-full h-full">
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-cyan-500/10 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-indigo-500/10 rounded-full blur-[120px]"></div>
    </div>

    <div id="content" class="w-full max-w-lg relative z-10 opacity-0 transition-opacity duration-700">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 px-4 py-2 bg-cyan-500/10 border border-cyan-500/20 rounded-full mb-4">
                <div class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></div>
                <span class="text-[10px] font-black uppercase tracking-[0.3em] text-cyan-400">Node Verified Portal</span>
            </div>
            <h1 class="text-4xl font-black text-white tracking-widest uppercase">Warranty<span class="text-cyan-400">Chain</span></h1>
        </div>

        <!-- Main Verification Card -->
        <div class="glass-card rounded-[2.5rem] p-10 glow relative overflow-hidden">
            <!-- Verified Header -->
            <div class="flex flex-col items-center mb-10">
                <div class="w-20 h-20 bg-emerald-500/10 rounded-3xl flex items-center justify-center mb-4 border border-emerald-500/30 status-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-400"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>
                </div>
                <h2 class="text-3xl font-black text-white tracking-tight">Warranty Verified</h2>
                <p class="text-slate-400 text-sm mt-2 font-medium">Authenticity confirmed on distributed ledger</p>
            </div>

            <!-- Product Data Grid -->
            <div class="space-y-8">
                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5">Product Identity</p>
                        <h3 id="name" class="text-2xl font-bold text-white tracking-tight">Loading...</h3>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-8 border-t border-white/5 pt-8">
                    <div>
                        <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5">Product ID</p>
                        <p id="id" class="text-sm font-mono text-cyan-400 font-bold">---</p>
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5">Current Status</p>
                        <div id="status-container" class="inline-flex items-center gap-2">
                             <span id="status" class="text-sm font-bold uppercase tracking-widest">---</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-8 border-t border-white/5 pt-8">
                    <div>
                        <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5">Owner Registered</p>
                        <p id="owner" class="text-sm font-bold text-slate-200">---</p>
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5">Warranty Expiry</p>
                        <p id="valid" class="text-sm font-bold text-slate-200">---</p>
                    </div>
                </div>
            </div>

            <!-- Footer Compliance -->
            <div class="mt-12 pt-8 border-t border-white/5 flex flex-col items-center">
                <div class="flex items-center gap-3 text-[9px] font-black text-slate-600 tracking-[0.4em] uppercase">
                    Blockchain · Immutable · Verified
                </div>
                <div class="mt-6 flex gap-4">
                    <div class="w-8 h-1 bg-cyan-500/30 rounded-full"></div>
                    <div class="w-8 h-1 bg-slate-700 rounded-full"></div>
                    <div class="w-8 h-1 bg-slate-700 rounded-full"></div>
                </div>
            </div>
        </div>

        <p class="text-center mt-8 text-slate-500 text-xs font-semibold">Verification Node: <span class="text-slate-400">GH-PAGES-PROD-VERIFY</span></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            
            const name = params.get('name') || "Invalid Record";
            const id = params.get('id') || "N/A";
            const owner = params.get('owner') || "N/A";
            const status = params.get('status') || "Inactive";
            const valid = params.get('valid') || "N/A";

            document.getElementById('name').textContent = name;
            document.getElementById('id').textContent = id;
            document.getElementById('owner').textContent = owner;
            document.getElementById('status').textContent = status;
            document.getElementById('valid').textContent = valid;

            const statusLabel = document.getElementById('status');
            if (status.toLowerCase().includes('active') || status.toLowerCase().includes('valid')) {
                statusLabel.classList.add('text-emerald-400');
            } else {
                statusLabel.classList.add('text-red-400');
                document.querySelector('.status-badge').classList.remove('status-badge');
            }

            // Entry animation
            setTimeout(() => {
                document.getElementById('content').classList.remove('opacity-0');
            }, 100);
        });
    </script>
</body>
</html>
